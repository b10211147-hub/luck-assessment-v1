<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8f1d2c">
  <title>線上預約｜奉母宮</title>
  <meta name="description" content="奉母宮線上選擇服務與預約時間">
  <link rel="stylesheet" href="booking.css?v=20260803-1">
</head>
<body>
  <header class="hero">
    <div class="brand"><span>奉</span><div><b>神明仲介所｜奉母宮</b><small>ONLINE APPOINTMENT</small></div></div>
    <div class="hero-copy"><p class="eyebrow">一站式線上預約</p><h1>選一段適合你的<br><em>安心時光</em></h1><p>選擇服務、日期與時間，確認資料後即可完成預約。</p></div>
  </header>

  <main id="app" class="page">
    <section id="identity" class="identity loading" aria-live="polite">
      <span id="identityIcon">•••</span>
      <div><b id="identityTitle">正在連接 LINE 身分</b><small>預約成功後，系統會將 LINE 識別資料安全地附在通知中。</small></div>
      <button id="retryLine" type="button" hidden>重新連接</button>
    </section>

    <section class="booking-card">
      <div class="section-title"><span>01</span><div><small>SELECT A DATE</small><h2>選擇預約日期</h2></div></div>
      <div id="dateArea" class="empty">正在載入可預約時間…</div>
      <div id="timeGrid" class="time-grid" hidden></div>
    </section>

    <section id="detailsCard" class="booking-card" hidden>
      <div class="section-title"><span>02</span><div><small>YOUR DETAILS</small><h2>確認預約資料</h2></div></div>
      <div id="selectedSummary" class="selected-summary"></div>
      <form id="bookingForm">
        <label>LINE 暱稱<span>*</span><input id="lineNickname" name="customerName" maxlength="40" readonly placeholder="連接 LINE 後自動帶入"></label>
        <label>想先告訴老師的事<textarea name="customerNote" maxlength="500" rows="4" placeholder="選填，例如：想詢問的主題或需要注意的事項"></textarea></label>
        <p id="errorMessage" class="error" hidden></p>
        <button id="submitButton" class="primary-button" type="submit" disabled>請先連接 LINE</button>
      </form>
    </section>

    <section id="successCard" class="success-card" hidden>
      <div class="success-icon">✓</div><p class="eyebrow">預約已成立</p><h1>我們已為你保留時間</h1>
      <dl id="successSummary" class="summary"></dl>
      <p class="hint">奉母宮已收到 Telegram 通知，請截圖保存預約編號。</p>
      <button id="newBooking" class="primary-button" type="button">預約其他時間</button>
    </section>

    <a id="adminLink" class="admin-link" href="https://fengmugong-registration-api.b10211147.chatgpt.site/booking/admin">排程管理</a>
  </main>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="booking.js?v=20260803-6"></script>
</body>
</html>
